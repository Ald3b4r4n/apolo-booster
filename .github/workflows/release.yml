name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex.: 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v$VERSION"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.APOLO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/apolo-release.jks"

      - name: Build signed release
        env:
          APOLO_KEYSTORE_PATH: ${{ runner.temp }}/apolo-release.jks
          APOLO_KEYSTORE_PASSWORD: ${{ secrets.APOLO_KEYSTORE_PASSWORD }}
          APOLO_KEY_ALIAS: ${{ secrets.APOLO_KEY_ALIAS }}
          APOLO_KEY_PASSWORD: ${{ secrets.APOLO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --console=plain \
            -Papolo.versionName=${{ steps.version.outputs.version }} \
            -Papolo.versionCode=${{ steps.version.outputs.code }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/ApoloBooster-${{ steps.version.outputs.version }}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Apolo Booster ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Apolo Booster ${{ steps.version.outputs.version }}

            APK assinado, compilado pelo CI a partir da tag `${{ steps.version.outputs.tag }}`.

            ### Como testar
            1. Baixe o APK abaixo e instale permitindo fonte desconhecida.
            2. Ative o boost e teste música, vídeo, jogo, fone e Bluetooth.
            3. Abra **Diagnóstico → Copiar relatório** e cole na issue de feedback.

            ### Verificação
            Confira o `SHA256SUMS.txt` anexado antes de instalar.
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
